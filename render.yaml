services:
  - type: web
    name: vob-judicial-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: export PYTHONPATH=$PYTHONPATH:. && gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./judicial.db
      - key: MOCK_MODE
        value: "true"
