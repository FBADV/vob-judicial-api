version: '3.8'

services:
  api:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/judicial_db
      - JWT_SECRET=top_secret_change_me
      - PFX_PATH=/app/certs/certificado.pfx
      - PFX_PASSWORD=secret_pfx_pass
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=judicial_db
    ports:
      - "5432:5432"

volumes:
  postgres_data:
